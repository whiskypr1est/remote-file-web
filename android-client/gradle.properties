# ============================================================
#  Gradle 构建参数
#  与 F:\安卓测试\AndroidApp 保持一致（那套已经在本机验证过）
# ============================================================

# 并行与缓存
org.gradle.parallel=true
org.gradle.caching=true

# Android 构建需要较大堆；file.encoding 固定成 UTF-8，
# 否则中文注释与中文资源在某些环境下会被按 GBK 解错。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# 非传递性 R 类，加快构建
android.nonTransitiveRClass=true
org.gradle.configureondemand=false

# 本工程**没有任何第三方依赖**（连 AndroidX 都不用），
# 所以下面这两项其实用不到；保留是为了将来真加了依赖时不用再想起来补。
android.useAndroidX=true
android.enableJetifier=false

# ------------------------------------------------------------
# ★ 关键：允许项目路径包含非 ASCII 字符。
#   本工程在 F:\远程仿真桌面\android-client，路径里有中文，
#   AGP 默认会因此直接报错拒绝构建；这是官方提供的绕开开关。
#   （F:\安卓测试\AndroidApp 也靠同一行才能构建。）
#
#   万一将来 aapt2 真的对中文路径报错，退路是把路径映射成纯 ASCII：
#       subst X: "F:\远程仿真桌面"
#       cd X:\android-client   （用 X: 构建，产物仍落在 F: 下）
#       subst X: /D            （用完解除）
# ------------------------------------------------------------
android.overridePathCheck=true
